name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        # Report-only: repo has a pre-existing baseline of lint errors/warnings
        # not yet triaged, so this step is informational and won't block PRs
        # until that baseline is cleaned up. Runs the same non-mutating
        # `npm run lint` a contributor would run locally (the old raw `npx
        # eslint` call here had drifted from package.json's script, whose
        # `lint` used to --fix in place — never safe for CI to run).
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npx vite build
