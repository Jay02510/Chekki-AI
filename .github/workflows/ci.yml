name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firestore rules tests
        run: npm i -g firebase-tools && npm run test:rules

      - name: End-to-end tests
        # Emulators + MOCK_GEMINI (.env.e2e): no production data, no Gemini cost.
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

      - name: Lint
        # Blocks on errors; warnings (mostly no-explicit-any) are a known
        # backlog and only reported.
        run: npm run lint

      - name: Build
        run: npx vite build
