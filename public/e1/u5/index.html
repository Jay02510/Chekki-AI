<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Chekki English 1 · Unit 5</title><style>
:root{--cream:#FFF8EC;--ink:#1F2430;--line:#D9D4CC;--orange:#EE9342;--blue:#3FA9D6;--green:#549E60;--purple:#8A76A7;--card:#fff;--mute:#5d6370;--ora-d:#B8590A}

.seg button[aria-pressed=true]{background:var(--blue);color:#fff;font-weight:700}
.tg{border:2px solid var(--green);background:none;color:var(--ink);border-radius:999px;font:inherit;font-size:14px;padding:8px 11px;min-height:44px;cursor:pointer}

.w img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px}.w b{display:block}.w small{color:var(--mute);font-size:13px}.w[disabled]{opacity:.5;cursor:default}
.ican{margin-top:10px;color:var(--green);font-weight:700;font-size:16px}
.stopbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--orange);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:9}

.no{display:none}.ko-on .en-only{display:none}.ko-on .no{display:revert}
