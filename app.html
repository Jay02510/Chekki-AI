    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dginphpy4/image/upload/e_background_removal/e_dropshadow:azimuth_220;elevation_60;spread_20/f_png,e_improve,e_sharpen/v1765769939/chekki-logo_q5xeux.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Will using Chekki make my child dependent on smartphones or screens?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Chekki is designed as a paper-to-digital bridge rather than a passive gaming or video app. Children complete their work using physical workbooks and pencils, and parents use Chekki for brief 1 to 2-second scans to check answers and review parent guidance scripts."
          }
        },
        {
          "@type": "Question",
          "name": "Does Chekki's pronunciation coaching use standard American accent profiles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Chekki operates on 100% standard North American English speech synthesis (TTS) and voice recognition (STT) calibrated for children's speech pitch and cadence, matching native North American instructor pronunciation."
          }
        },
        {
          "@type": "Question",
          "name": "Is Chekki safe for a 6-year-old child to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chekki is a 100% ad-free, secure, and child-friendly environment. Children can practice pronunciation and review error notebooks independently, while parents can use the built-in parent scripts to guide learning."
          }
        },
        {
          "@type": "Question",
          "name": "How does Chekki handle different academy workbooks like Poly, GATE, or PSA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chekki is powered by Google Gemini multimodal AI OCR which dynamically analyzes reading worksheets, phonics grids, and grammar exercises from any academy workbook or commercial publisher without fixed templates."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Chekki cost compared to private tutoring?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chekki offers a free Explorer tier with 3 daily scans, and a Pro tier providing unlimited scans for a small fraction of private tutoring costs."
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#050505] text-zinc-100 antialiased selection:bg-brand-orange selection:text-white overscroll-none">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/1.43.1/kakao.min.js" defer></script>
    <script defer>
      // Initialize Kakao SDK with the app key
      if (window.Kakao && !window.Kakao.isInitialized()) {
        window.Kakao.init('f06bc75426bf2b41940620d3ee942f06');
      }
    </script>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.overflow = 'auto';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.innerHTML = '<h3>Global Error Caught</h3><p><b>Message:</b> ' + message + '</p><p><b>Source:</b> ' + source + ':' + lineno + ':' + colno + '</p><pre>' + (error && error.stack ? error.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      };
      window.onunhandledrejection = function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(150, 0, 0, 0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.overflow = 'auto';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.innerHTML = '<h3>Unhandled Promise Rejection</h3><p><b>Reason:</b> ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</p><pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>';
        document.body.appendChild(errDiv);
      };
    </script>
    <div id="root">
      <!-- Static fallback for crawlers that don't execute JavaScript. React
           replaces this content on mount; real users never see it. -->
      <main>
        <h1>Chekki AI — Homework Helper &amp; Teacher/Director Portal</h1>
        <p>Sign in to scan and check homework, or to manage classes, review homework scans, and send parent reports as a teacher or academy director.</p>
      </main>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
